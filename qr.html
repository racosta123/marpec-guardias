<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR del puesto · MARPEC Guardias</title>
  <meta name="theme-color" content="#1B2A55">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://marpec-guardias-proxy.acosta4770.workers.dev; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" type="image/png" href="marpec-logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="qr-body">
  <main class="qr-hoja" id="hoja">
    <img class="qr-logo" src="marpec-logo.png" alt="MARPEC Seguridad Privada" width="211" height="225">
    <h1 class="qr-empresa">MARPEC Seguridad Privada</h1>
    <p id="qr-estado" role="status">Cargando…</p>
    <h2 id="qr-sitio" class="qr-sitio" hidden></h2>
    <p id="qr-dir" class="qr-dir" hidden></p>
    <div id="qr-contenedor" class="qr-contenedor" hidden></div>
    <p id="qr-pie" class="qr-pie" hidden></p>
    <div class="qr-acciones no-print">
      <button id="qr-imprimir" class="btn primario" type="button" hidden>Imprimir</button>
      <a class="btn secundario" href="./">Volver a la app</a>
    </div>
  </main>
  <script type="module" src="js/qr-page.js"></script>
</body>
</html>
