name = "marpec-guardias-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Variables NO sensibles (públicas por diseño).
[vars]
FIREBASE_PROJECT_ID = "marpec-guardias"
ALLOWED_ORIGIN = "https://racosta123.github.io,https://marpec-guardias.netlify.app"

# Secrets (NUNCA aquí; se cargan con `wrangler secret put`):
#   SERVICE_ACCOUNT_JSON  - JSON completo de la cuenta de servicio de Firebase
#   PIN_PEPPER            - cadena aleatoria larga (>= 32 bytes) para el hash de PIN
#   SETUP_TOKEN           - token de un solo uso para crear el primer admin (borrar después)
#   QR_SECRET             - llave HMAC para firmar los QR de los puestos
#   VAPID_PRIVATE_JWK     - llave privada VAPID (JWK ECDSA P-256) para las notificaciones push (Fase 6); `node tools/rotate-secrets.mjs vapid`

# Selfies de asistencia: bucket R2 PRIVADO (sin acceso público; solo este Worker lo lee y escribe).
[[r2_buckets]]
binding = "SELFIES"
bucket_name = "marpec-guardias-selfies"

# Recalcula cada 5 min la asistencia de los turnos recientes (alertas de relevo y horas extra en curso).
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
